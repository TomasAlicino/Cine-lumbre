<div class="chips" role="group" aria-label="Días de la semana">
  @for (d of dias; track d.valor) {
    <button
      type="button"
      class="chip"
      [class.activo]="valores().includes(d.valor)"
      [attr.aria-pressed]="valores().includes(d.valor)"
      [attr.aria-label]="d.largo"
      (click)="alternar(d.valor)"
    >
      {{ d.corto }}
    </button>
  }
  <button type="button" class="btn-texto chico" (click)="todos()">Todos</button>
</div>
